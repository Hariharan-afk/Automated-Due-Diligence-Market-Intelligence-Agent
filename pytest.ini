[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --ignore=tests/run_all_tests.py
    --ignore=tests/archived/

# Test markers for focused testing
markers =
    unit: Unit tests for individual components
    edge_case: Tests for edge cases and boundary conditions
    data_quality: Tests for missing values and anomalies
    integration: Integration tests for complete pipeline

# Simplified logging for tests
log_cli = false
log_cli_level = WARNING

# Warnings configuration
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
