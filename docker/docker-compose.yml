version: '3.8'

services:
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: datapipeline_airflow_scheduler
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
      - ../configs:/opt/airflow/configs
      - ./logs:/opt/airflow/logs
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/plugins:/opt/airflow/src
      - AIRFLOW__WEBSERVER__SECRET_KEY=DCyF3r1O-56B_6FukhYwQFQNIKzQPb_2Hw3caAolX3o
      - AIRFLOW__CORE__PARALLELISM=2
      - AIRFLOW__CORE__DAG_CONCURRENCY=1
      - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=due_diligence_dev          # ← Change from 'airflow'
      - POSTGRES_USER=pipeline_user             # ← Change from 'airflow'
      - POSTGRES_PASSWORD=SecurePassword123!    # ← Change from 'airflow'
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SEC_API_KEY=${SEC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
    depends_on:
      - postgres
      - qdrant
    command: scheduler

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: datapipeline_airflow_webserver
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
      - ../configs:/opt/airflow/configs
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/plugins:/opt/airflow/src
      - AIRFLOW__WEBSERVER__SECRET_KEY=DCyF3r1O-56B_6FukhYwQFQNIKzQPb_2Hw3caAolX3o
      - AIRFLOW__WEBSERVER__WORKERS=2
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=due_diligence_dev          # ← Change from 'airflow'
      - POSTGRES_USER=pipeline_user             # ← Change from 'airflow'
      - POSTGRES_PASSWORD=SecurePassword123!    # ← Change from 'airflow'
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SEC_API_KEY=${SEC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - qdrant
    command: webserver

  postgres:
    image: postgres:15
    container_name: datapipeline_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  qdrant:
    image: qdrant/qdrant:latest
    container_name: datapipeline_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  postgres-db-volume:
  qdrant-storage: