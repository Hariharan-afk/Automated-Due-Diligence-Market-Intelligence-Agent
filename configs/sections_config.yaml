# Section codes for SEC filings
sec_filing_sections:
  "10-K":
    "1": "Business"
    "1A": "Risk Factors"
    "7": "Management Discussion and Analysis"
    "8": "Financial Statements"
  
  "10-Q":
    "part1item1": "Financial Statements"
    "part1item2": "Management Discussion and Analysis"
    "part2item1a": "Risk Factors"

# Filing frequency per year
filing_frequency:
  "10-K": 1
  "10-Q": 3

# Extraction settings
extraction:
  return_type: "text"
  max_retries: 3
  retry_delay: 1.0
  timeout: 30

# Chunking strategy - SECTION-SPECIFIC SIZES
chunking_strategy:
  # 10-K sections
  "1":
    chunk_size: 512
    chunk_overlap: 50
    rationale: "Factual business descriptions"
  
  "1A":
    chunk_size: 768
    chunk_overlap: 100
    rationale: "Complex interconnected risks need context"
  
  "7":
    chunk_size: 768
    chunk_overlap: 100
    rationale: "Management narrative and trend analysis"
  
  "8":
    chunk_size: 512
    chunk_overlap: 50
    rationale: "Primarily tables with brief text"
  
  # 10-Q sections
  "part1item1":
    chunk_size: 512
    chunk_overlap: 50
  
  "part1item2":
    chunk_size: 640
    chunk_overlap: 75
    rationale: "Quarterly MD&A analysis"
  
  "part2item1a":
    chunk_size: 640
    chunk_overlap: 75
    rationale: "Quarterly risk updates"
  
  # Default fallback
  default:
    chunk_size: 512
    chunk_overlap: 50
  
  # Table context settings
  tables:
    context_sentences_before: 3
    context_sentences_after: 2
    summarize_via_llm: true
    convert_to_markdown: true
    keep_whole: true

# Error handling
error_handling:
  mode: "strict"
  log_failed_sections: true
  continue_on_filing_failure: true