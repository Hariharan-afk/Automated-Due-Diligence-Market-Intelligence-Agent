schema: '2.0'
stages:
  data_acquisition:
    cmd: python scripts/run_pipeline.py --stage acquisition --company "Apple 
      Inc"
    deps:
    - path: data/company_tickers.json
      hash: md5
      md5: 5b8bf0485a46856c5927509f73273c6c
      size: 1023062
    - path: src/data_acquisition.py
      hash: md5
      md5: 6d7524dce847abdefa94eab027f670d7
      size: 21943
    - path: src/sec_fetcher.py
      hash: md5
      md5: fd87bc008a3ada2d1b31f3d259e576bd
      size: 20531
    params:
      params.yaml:
        company: Apple Inc
      config/config.yaml:
        data_sources:
          wikipedia:
            enabled: true
            user_agent: CompanyResearchPipeline/1.0 (research@example.com)
            language: en
            extract_format: WIKI
          news_api:
            enabled: true
            max_articles: 20
            language: en
            sort_by: publishedAt
          gdelt:
            enabled: true
            max_records: 20
            source_country: US
            source_language: ENGLISH
        news_api_key: ${NEWS_API_KEY}
        sec_api:
          base_url: https://api.sec-api.io
          use_free_api: true
          cache_enabled: true
          rate_limit:
            calls_per_minute: 10
            max_retries: 3
            backoff_factor: 2.0
          filings:
            types:
            - 10-K
            - 10-Q
            years_to_fetch: 3
            sections_to_extract:
              10-K:
              - '1'
              - 1A
              - '7'
              - '8'
              10-Q:
              - part1item1
              - part1item2
              - part2item1a
    outs:
    - path: data/metrics/acquisition_metrics.json
      hash: md5
      md5: 0708becfbe745ce2a7f3764ce1ee9b59
      size: 191
    - path: data/raw
      hash: md5
      md5: bee06f9c3dae39564d0af6c4d233d750.dir
      size: 11279763
      nfiles: 37
  data_preprocessing:
    cmd: python scripts/run_pipeline.py --stage preprocessing --input 
      data/raw/latest.json
    deps:
    - path: data/raw
      hash: md5
      md5: bee06f9c3dae39564d0af6c4d233d750.dir
      size: 11279763
      nfiles: 37
    - path: src/chunking.py
      hash: md5
      md5: 4efeea746cd7b387209e6ca63ee32343
      size: 34266
    - path: src/data_preprocessing.py
      hash: md5
      md5: 86a8a76bab632589064527f3c7eb654e
      size: 19323
    params:
      config/config.yaml:
        chunking:
          chunk_size: 500
          overlap: 50
          preserve_tables: true
          table_context_paragraphs: 2
          min_chunk_size: 100
    outs:
    - path: data/metrics/preprocessing_metrics.json
      hash: md5
      md5: bf3b485973aedc1fd0b838b3beb8fb57
      size: 229
    - path: data/processed
      hash: md5
      md5: d90f915195f4dd8bf2a0ab367dff13cb.dir
      size: 5514189
      nfiles: 19
  schema_validation:
    cmd: python scripts/run_pipeline.py --stage validation --input 
      data/processed/latest.json
    deps:
    - path: data/processed
      hash: md5
      md5: d90f915195f4dd8bf2a0ab367dff13cb.dir
      size: 5514189
      nfiles: 19
    - path: src/schema_validator.py
      hash: md5
      md5: e3a2415b64d9f4f4fca82a8396bcc8c2
      size: 20612
    outs:
    - path: data/metrics/quality_metrics.json
      hash: md5
      md5: 05f658544f7a82c00091c1489ed95e59
      size: 164
    - path: data/quality_reports
      hash: md5
      md5: 8b31c16e9be37916cfd93d5a5125a8e6.dir
      size: 1197
      nfiles: 1
  bias_detection:
    cmd: python scripts/run_pipeline.py --stage bias --input 
      data/processed/latest.json
    deps:
    - path: data/processed
      hash: md5
      md5: d90f915195f4dd8bf2a0ab367dff13cb.dir
      size: 5514189
      nfiles: 19
    - path: src/bias_detector.py
      hash: md5
      md5: 23414d4a1ea57aeeab3805191717d91c
      size: 25189
    outs:
    - path: data/bias_reports
      hash: md5
      md5: 56e21a654be1e22e7369ce0705507b25.dir
      size: 8391
      nfiles: 1
    - path: data/metrics/bias_metrics.json
      hash: md5
      md5: 7862e4b4ed8371e198d51ddbe402ae3f
      size: 171
  database_storage:
    cmd: python scripts/run_pipeline.py --stage storage --input 
      data/processed/latest.json
    deps:
    - path: data/processed
      hash: md5
      md5: d90f915195f4dd8bf2a0ab367dff13cb.dir
      size: 5514189
      nfiles: 19
    - path: src/db_manager.py
      hash: md5
      md5: 036e3e6a3206fde67a99fbe53b176e32
      size: 12763
