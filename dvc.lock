schema: '2.0'
stages:
  data_acquisition:
    cmd: python scripts/run_pipeline.py --stage acquisition --company "Apple 
      Inc"
    deps:
    - path: data/company_tickers.json
      hash: md5
      md5: 5b8bf0485a46856c5927509f73273c6c
      size: 1023062
    - path: src/data_acquisition.py
      hash: md5
      md5: 6d7524dce847abdefa94eab027f670d7
      size: 21943
    - path: src/sec_fetcher.py
      hash: md5
      md5: fd87bc008a3ada2d1b31f3d259e576bd
      size: 20531
    params:
      params.yaml:
        company: Apple Inc
      config/config.yaml:
        data_sources:
          wikipedia:
            enabled: true
            user_agent: CompanyResearchPipeline/1.0 (research@example.com)
            language: en
            extract_format: WIKI
          news_api:
            enabled: true
            max_articles: 20
            language: en
            sort_by: publishedAt
          gdelt:
            enabled: true
            max_records: 20
            source_country: US
            source_language: ENGLISH
        news_api_key: ${NEWS_API_KEY}
        sec_api:
          base_url: https://api.sec-api.io
          use_free_api: true
          cache_enabled: true
          rate_limit:
            calls_per_minute: 10
            max_retries: 3
            backoff_factor: 2.0
          filings:
            types:
            - 10-K
            - 10-Q
            years_to_fetch: 3
            sections_to_extract:
              10-K:
              - '1'
              - 1A
              - '7'
              - '8'
              10-Q:
              - part1item1
              - part1item2
              - part2item1a
    outs:
    - path: data/metrics/acquisition_metrics.json
      hash: md5
      md5: f89a23badcce870037dfdb1f97f2e9c6
      size: 169
    - path: data/raw
      hash: md5
      md5: e93597557641dd3bb0b74f691cfab2ae.dir
      size: 7316219
      nfiles: 28
  data_preprocessing:
    cmd: python scripts/run_pipeline.py --stage preprocessing --input 
      data/raw/latest.json
    deps:
    - path: data/raw
      hash: md5
      md5: e93597557641dd3bb0b74f691cfab2ae.dir
      size: 7316219
      nfiles: 28
    - path: src/chunking.py
      hash: md5
      md5: 4efeea746cd7b387209e6ca63ee32343
      size: 34266
    - path: src/data_preprocessing.py
      hash: md5
      md5: 86a8a76bab632589064527f3c7eb654e
      size: 19323
    params:
      config/config.yaml:
        chunking:
          chunk_size: 500
          overlap: 50
          preserve_tables: true
          table_context_paragraphs: 2
          min_chunk_size: 100
    outs:
    - path: data/metrics/preprocessing_metrics.json
      hash: md5
      md5: 088798df4346dae57a2fad456ee33bb3
      size: 205
    - path: data/processed
      hash: md5
      md5: 48f7cae452c31e110b594230172a6532.dir
      size: 1663372
      nfiles: 10
  schema_validation:
    cmd: python scripts/run_pipeline.py --stage validation --input 
      data/processed/latest.json
    deps:
    - path: data/processed
      hash: md5
      md5: 48f7cae452c31e110b594230172a6532.dir
      size: 1663372
      nfiles: 10
    - path: src/schema_validator.py
      hash: md5
      md5: e3a2415b64d9f4f4fca82a8396bcc8c2
      size: 20612
    outs:
    - path: data/metrics/quality_metrics.json
      hash: md5
      md5: 86601348ee745d270106ed6a8c3e4652
      size: 144
    - path: data/quality_reports
      hash: md5
      md5: 5aa8be0fa88d0ab46b8bedbc5f18d5e0.dir
      size: 1197
      nfiles: 1
  bias_detection:
    cmd: python scripts/run_pipeline.py --stage bias --input 
      data/processed/latest.json
    deps:
    - path: data/processed
      hash: md5
      md5: 48f7cae452c31e110b594230172a6532.dir
      size: 1663372
      nfiles: 10
    - path: src/bias_detector.py
      hash: md5
      md5: 23414d4a1ea57aeeab3805191717d91c
      size: 25189
    outs:
    - path: data/bias_reports
      hash: md5
      md5: 39bcb1cce66a7600af36f6e8e91e2419.dir
      size: 8391
      nfiles: 1
    - path: data/metrics/bias_metrics.json
      hash: md5
      md5: b9f3841dba4fe3cd0cbeab21b5df40b5
      size: 151
  database_storage:
    cmd: python scripts/run_pipeline.py --stage storage --input 
      data/processed/latest.json
    deps:
    - path: data/processed
      hash: md5
      md5: 48f7cae452c31e110b594230172a6532.dir
      size: 1663372
      nfiles: 10
