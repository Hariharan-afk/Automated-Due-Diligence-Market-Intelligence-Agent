schema: '2.0'
stages:
  data_acquisition:
    cmd: python scripts/run_pipeline.py --stage acquisition --company "Apple Inc"
    deps:
    - path: data/company_tickers.json
      hash: md5
      md5: 9c38af17bb9149ab539e52e4a73ca575
      size: 1070466
    - path: src/data_acquisition.py
      hash: md5
      md5: 658a55183a420cfbe6edbd3ba0819b8c
      size: 23768
    - path: src/sec_fetcher.py
      hash: md5
      md5: fa5c609639de5b4c059e7eee93150526
      size: 21117
    params:
      params.yaml:
        company: Apple Inc
      config/config.yaml:
        data_sources:
          wikipedia:
            enabled: true
            user_agent: CompanyResearchPipeline/1.0 (research@example.com)
            language: en
            extract_format: WIKI
          news_api:
            enabled: true
            max_articles: 20
            language: en
            sort_by: publishedAt
          gdelt:
            enabled: true
            max_records: 20
            source_country: US
            source_language: ENGLISH
        news_api_key: ${NEWS_API_KEY}
        sec_api:
          base_url: https://api.sec-api.io
          use_free_api: true
          cache_enabled: true
          rate_limit:
            calls_per_minute: 10
            max_retries: 3
            backoff_factor: 2.0
          filings:
            types:
            - 10-K
            - 10-Q
            years_to_fetch: 3
            sections_to_extract:
              10-K:
              - '1'
              - 1A
              - '7'
              - '8'
              10-Q:
              - part1item1
              - part1item2
              - part2item1a
    outs:
    - path: data/metrics/acquisition_metrics.json
      hash: md5
      md5: ffe3764f508e961a9248258d9f0dba20
      size: 191
    - path: data/raw
      hash: md5
      md5: be5f98620939c58f108c2d16bce4d92a.dir
      size: 4811792
      nfiles: 29
  data_preprocessing:
    cmd: python scripts/run_pipeline.py --stage preprocessing --input data/raw/latest.json
    deps:
    - path: data/raw
      hash: md5
      md5: be5f98620939c58f108c2d16bce4d92a.dir
      size: 4811792
      nfiles: 29
    - path: src/chunking.py
      hash: md5
      md5: 8cba37e8cd5ad5ccbc7e48dcf27a2e3a
      size: 35211
    - path: src/data_preprocessing.py
      hash: md5
      md5: 528c4d7424effca220913aa30efaa827
      size: 20475
    params:
      config/config.yaml:
        chunking:
          chunk_size: 500
          overlap: 50
          preserve_tables: true
          table_context_paragraphs: 2
          min_chunk_size: 100
    outs:
    - path: data/metrics/preprocessing_metrics.json
      hash: md5
      md5: fa6b8008cdd857dfd8bc1e95eee384b4
      size: 228
    - path: data/processed
