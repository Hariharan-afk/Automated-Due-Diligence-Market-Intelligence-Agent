    - path: data/metrics/bias_metrics.json
      hash: md5
      md5: 6b28065def52b6641ab520ad7156e6ef
      size: 151
  database_storage:
    cmd: python scripts/run_pipeline.py --stage storage --input data/processed/latest.json
    deps:
    - path: data/processed
      hash: md5
