# Configuration file for Company Research Data Pipeline

# Project Paths (can be overridden with environment variables)
paths:
  project_root: "${PROJECT_ROOT:-.}"
  data_dir: "${DATA_DIR:-./data}"
  logs_dir: "${LOGS_DIR:-./logs}"
  config_dir: "${CONFIG_DIR:-./config}"

# API Keys (Store sensitive keys in environment variables)
news_api_key: "${NEWS_API_KEY}"
polygon_api_key: "${POLYGON_API_KEY}"
sec_api_key: "${SEC_API_KEY}"

# Ticker File Configuration
ticker_file:
  path: "data/company_tickers.json"
  format: "json"  # or "csv"
  source: "SEC"

# Data Sources
data_sources:
  wikipedia:
    enabled: true
    user_agent: "CompanyResearchPipeline/1.0 (research@example.com)"
    language: "en"
    extract_format: "WIKI"
  
  news_api:
    enabled: true
    max_articles: 20
    language: "en"
    sort_by: "publishedAt"
  
  gdelt:
    enabled: true
    max_records: 20
    source_country: "US"
    source_language: "ENGLISH"

# SEC EDGAR API Configuration
sec_api:
  base_url: "https://api.sec-api.io"
  use_free_api: true  # Use free URL-based queries when possible to save API credits
  cache_enabled: true  # Cache fetched filings to avoid re-downloading

  rate_limit:
    calls_per_minute: 10
    max_retries: 3
    backoff_factor: 2.0

  filings:
    types: ["10-K", "10-Q"]
    years_to_fetch: 3
    # Sections to extract from each filing type
    sections_to_extract:
      10-K:
        - "1"   # Business
        - "1A"  # Risk Factors
        - "7"   # MD&A
        - "8"   # Financial Statements
      10-Q:
        - "part1item1"   # Financial Statements
        - "part1item2"   # MD&A
        - "part2item1a"  # Risk Factors

# Document Chunking Configuration (for RAG)
chunking:
  chunk_size: 500  # tokens per chunk
  overlap: 50      # token overlap between chunks
  preserve_tables: true  # Keep tables with surrounding context
  table_context_paragraphs: 2  # Number of paragraphs before/after table to include
  min_chunk_size: 100  # Minimum tokens for a valid chunk

# Vector Store Configuration (for RAG retrieval)
vector_store:
  type: "faiss"  # faiss, pinecone, weaviate
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  embedding_dim: 768
  similarity_metric: "l2"  # l2, cosine, ip
  index_path: "data/vector_store/faiss_index"
  metadata_path: "data/vector_store/metadata.pkl"

# Database Configuration
database:
  path: "${DB_PATH:-data/company_data.db}"
  backup_enabled: true
  backup_frequency: "daily"

# Data Processing
preprocessing:
  remove_html: true
  normalize_dates: true
  remove_duplicates: true
  min_article_length: 10
  max_article_age_days: 365

# Quality Thresholds
quality_thresholds:
  min_wiki_word_count: 100
  max_wiki_word_count: 100000
  min_news_articles: 1
  max_news_articles: 100
  min_article_word_count: 10
  max_days_old: 365
  min_quality_score: 50

# Anomaly Detection
anomaly_detection:
  enabled: true
  alert_on_errors: true
  alert_on_warnings: false

# Bias Detection
bias_detection:
  enabled: true
  source_dominance_threshold: 0.5
  min_source_diversity: 3
  recency_bias_threshold: 0.7
  quality_variance_threshold: 0.5

# Alerting Configuration
alerting:
  enabled: true
  channels:
    email:
      enabled: false
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      sender: "${ALERT_EMAIL_SENDER}"
      recipients:
        - "team@company.com"
    slack:
      enabled: false
      webhook_url: "${SLACK_WEBHOOK_URL}"

  # Alert thresholds
  thresholds:
    quality_score_min: 70
    fairness_score_min: 60
    missing_data_threshold: 0.3
    api_failure_threshold: 3

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
  max_bytes: 10485760
  backup_count: 5

# Airflow
airflow:
  schedule_interval: "@daily"
  catchup: false
  max_active_runs: 1
  retries: 2
  retry_delay_minutes: 5

# DVC
dvc:
  remote: "s3://my-company-dvc-storage"
  cache_dir: ".dvc/cache"

# Companies to Research
companies:
  - "Apple Inc"
  - "Microsoft Corporation"
  - "Alphabet Inc"
  - "Amazon.com Inc"
  - "Tesla Inc"

# Performance
performance:
  enable_caching: true
  cache_ttl_hours: 24
  max_workers: 4
  rate_limit_delay_seconds: 2

# Pipeline Configuration (for orchestration)
pipeline:
  sec_filings:
    years_to_fetch: 3
    types: ["10-K", "10-Q"]
  rate_limit:
    calls_per_minute: 10