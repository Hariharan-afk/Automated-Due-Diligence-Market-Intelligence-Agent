# Configuration file for Company Research Data Pipeline

# API Keys (Store sensitive keys in environment variables)
news_api_key: "${NEWS_API_KEY}"
polygon_api_key: "${POLYGON_API_KEY}"

# Ticker File Configuration
ticker_file:
  path: "data/company_tickers.json"
  format: "json"  # or "csv"
  source: "SEC"

# Data Sources
data_sources:
  wikipedia:
    enabled: true
    user_agent: "CompanyResearchPipeline/1.0 (research@example.com)"
    language: "en"
    extract_format: "WIKI"
  
  news_api:
    enabled: true
    max_articles: 20
    language: "en"
    sort_by: "publishedAt"
  
  gdelt:
    enabled: true
    max_records: 20
    source_country: "US"
    source_language: "ENGLISH"

# Database Configuration
database:
  path: "data/company_data.db"
  backup_enabled: true
  backup_frequency: "daily"

# Data Processing
preprocessing:
  remove_html: true
  normalize_dates: true
  remove_duplicates: true
  min_article_length: 10
  max_article_age_days: 365

# Quality Thresholds
quality_thresholds:
  min_wiki_word_count: 100
  max_wiki_word_count: 100000
  min_news_articles: 1
  max_news_articles: 100
  min_article_word_count: 10
  max_days_old: 365
  min_quality_score: 50

# Anomaly Detection
anomaly_detection:
  enabled: true
  alert_on_errors: true
  alert_on_warnings: false

# Bias Detection
bias_detection:
  enabled: true
  source_dominance_threshold: 0.5
  min_source_diversity: 3
  recency_bias_threshold: 0.7
  quality_variance_threshold: 0.5

# Alerts
alerts:
  email:
    enabled: false
    recipients:
      - "team@company.com"
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
  
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
  max_bytes: 10485760
  backup_count: 5

# Airflow
airflow:
  schedule_interval: "@daily"
  catchup: false
  max_active_runs: 1
  retries: 2
  retry_delay_minutes: 5

# DVC
dvc:
  remote: "s3://my-company-dvc-storage"
  cache_dir: ".dvc/cache"

# Companies to Research
companies:
  - "Apple Inc"
  - "Microsoft Corporation"
  - "Alphabet Inc"
  - "Amazon.com Inc"
  - "Tesla Inc"

# Performance
performance:
  enable_caching: true
  cache_ttl_hours: 24
  max_workers: 4
  rate_limit_delay_seconds: 2